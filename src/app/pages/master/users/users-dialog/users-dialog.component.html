<h2 mat-dialog-title class="m-b-24 b-b-1 p-b-20">{{ action }} Users</h2>
<mat-dialog-content class="mat-typography" style="max-width: 600px" *ngIf="action !== 'Delete'; else elseTemplate" >
  <form [formGroup]="UsersForm">
    <div class="row">
        <div class="col-12 col-md-6">
            <mat-form-field appearance="outline" class="w-100 m-t-10">
                <mat-label>User First Name</mat-label>
                <input type="text" matInput placeholder="User First Name" formControlName="firstName">
            </mat-form-field>
        </div>
           
        <div class="col-12 col-md-6">
            <mat-form-field appearance="outline" class="w-100 m-t-10">
                <mat-label>User last Name</mat-label>
                <input type="text" matInput placeholder="User Last Name" formControlName="lastName">
            </mat-form-field>
        </div>

        <div class="col-12 col-md-6">            
            <mat-form-field appearance="outline" class="w-100 m-t-10">
              <mat-label>Email</mat-label>
              <input type="text" matInput placeholder="Email" formControlName="email">
              <mat-error *ngIf="UsersForm.get('email')?.hasError('emailTaken')">
                Email already used.
              </mat-error> 
            </mat-form-field>
        </div>

        <!-- <div class="col-12 col-md-6">
            <mat-form-field appearance="outline" class="w-100 m-t-10">
                <mat-label>Domain Name</mat-label>
                <input type="text" matInput placeholder="User First Name" formControlName="domainName">
                <mat-error *ngIf="UsersForm.get('domainName')?.hasError('required') && UsersForm.get('domainName')?.touched"
                  class="error-message error-color">
                  Domain name already used
                </mat-error>
            </mat-form-field>
        </div> -->
        <!-- <div class="col-12 col-md-6">
            <mat-form-field appearance="outline" class="w-100 m-t-10">
                <mat-label>Role</mat-label>
                <input type="text" matInput placeholder="User First Name" formControlName="role">
            </mat-form-field>
        </div> -->
        
        <div class="col-12 col-md-6">
            <mat-form-field appearance="outline" class="w-100 m-t-10">
                <mat-label>Role</mat-label>
                <mat-select #dropdown formControlName="role" placeholder="Select Role">
                    <mat-option *ngFor="let item of roleType" [value]="item">{{item}}</mat-option>
                </mat-select>
            </mat-form-field>
        </div>

        <div class="col-12 col-md-6">    
            <mat-form-field appearance="outline" class="w-100 m-t-10">
                <mat-label>User Name</mat-label>
                <input type="text" matInput placeholder="User Name" formControlName="userName">
            </mat-form-field>
        </div>
        
        <div class="col-12 col-md-6">    
            <mat-form-field appearance="outline" class="w-100 m-t-10">
                <mat-label>User Password</mat-label>
                <input type="password" matInput placeholder="User Password" formControlName="password">
            </mat-form-field>
        </div>

        <div class="col-12 col-md-6">    
              <mat-card-content class="b-t-1">
        <mat-slide-toggle color="primary" formControlName="isActive">isActive</mat-slide-toggle>
      </mat-card-content>
        </div>
    </div>
    <mat-divider></mat-divider>
    <mat-dialog-actions class="p-24 justify-content-end">
      <button mat-stroked-button color="warn" mat-dialog-close>{{'productMasterdialog.Cancel' | translate}}</button>
      <button mat-flat-button [disabled]="!UsersForm.valid" color="primary" (click)="submit();">
        {{ action}}
      </button>
    </mat-dialog-actions>
  </form>
</mat-dialog-content>
<ng-template #elseTemplate>
  <div class="p-x-24">
    <p>{{'productMasterdialog.Suretodelete' | translate}}<span class="f-w-600">{{local_data.Name}}</span> ?</p>
  </div>
  <mat-divider></mat-divider>
  <div mat-dialog-actions class="p-x-24 p-b-24 m-t-10 justify-content-end">
    <button mat-button (click)="submit()" mat-flat-button color="warn">
      {{ action}}
    </button>
    <button mat-stroked-button color="warn" (click)="closeDialog()" class="m-l-8">{{'productMasterdialog.Cancel' | translate}}</button>
  </div>
</ng-template>
